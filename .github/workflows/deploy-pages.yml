name: Deploy ELPA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes from the reviewed-Issue importer do not trigger push workflows.
  workflow_run:
    workflows: ["Publish completed ELPA submissions"]
    types: [completed]

concurrency:
  group: elpa-pages-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'issues') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always build trusted, current main. Never check out an untrusted workflow_run head.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check whether the review changed main
        id: reviewed-change
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          REVIEW_BASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$REVIEW_BASE_SHA" ]]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: ${{ github.event_name != 'workflow_run' || steps.reviewed-change.outputs.updated == 'true' }}
        with:
          python-version: '3.12'
      - name: Build portable site
        if: ${{ github.event_name != 'workflow_run' || steps.reviewed-change.outputs.updated == 'true' }}
        run: python preview.py --build-only
      - uses: actions/configure-pages@v6
        if: ${{ github.event_name != 'workflow_run' || steps.reviewed-change.outputs.updated == 'true' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.event_name != 'workflow_run' || steps.reviewed-change.outputs.updated == 'true' }}
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ github.event_name != 'workflow_run' || steps.reviewed-change.outputs.updated == 'true' }}
        uses: actions/deploy-pages@v5
