name: Publish completed ELPA submissions

on:
  issues:
    types: [closed]

# A completed closure by the repository owner is the single approval signal.
# Other close reasons, including duplicate and not_planned, do not publish.
concurrency:
  group: elpa-question-bank-publication
  queue: max

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      ${{ github.event.sender.login == 'FuTseYi' &&
          github.event.issue.state_reason == 'completed' &&
          github.event.issue.state == 'closed' &&
          !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import, validate, and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Serialization protects other submissions; retries cover unrelated main updates.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B submission-publication origin/main
            git reset --hard origin/main
            git clean -fd -- question-bank/
            # The importer reads untrusted issue content strictly as data.
            # Never interpolate an Issue field into a command.
            node scripts/import-completed-submission.cjs
            git add -A -- question-bank/
            if git diff --cached --quiet; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "Already recorded or exact duplicate; no publish needed"
              exit 0
            fi
            node scripts/check-submission-diff.cjs
            npm run check
            npm test
            git commit -m "docs: publish reviewed ELPA issue #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Published Issue #${ISSUE_NUMBER} to main"
              exit 0
            fi
            echo "main moved during publication; retrying against latest data (${attempt}/3)"
            sleep 2
          done
          echo "Unable to publish after concurrent updates" >&2
          exit 1
      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Automatic publication failed or needs attention. Review the [workflow run]($RUN_URL). The Issue remains closed as completed; rerun the failed workflow after fixing the problem."
