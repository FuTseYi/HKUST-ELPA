name: Validate ELPA website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python preview.py --build-only
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          ELPA_SITE_ROOT: _site
