name: Validate ELPA website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node scripts/validate-site.cjs
      - run: node --test
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python preview.py --build-only
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/browser_smoke.py
        env:
          ELPA_SITE_ROOT: _site
