name: Validate ELPA website

on:
  pull_request:
    paths:
      - 'index.html'
      - 'question-bank/questions.js'
      - 'assets/Administration-Building-14-1536x864.jpg'
      - '.github/workflows/site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'question-bank/questions.js'
      - '.github/workflows/site-checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract script and check required UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert len(scripts) == 1, 'Expected a single inline JavaScript application script'
          Path('/tmp/elpa-app.js').write_text(scripts[0], encoding='utf-8')

          class IdCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  if 'id' in props:
                      self.ids.append(props['id'])
          collector = IdCollector()
          collector.feed(html)
          for key in ['searchInput', 'statusFilter', 'matchCount', 'backupBtn',
                      'restoreBtn', 'restoreInput', 'bankPast', 'bankD',
                      'progressBar', 'saveBtn', 'saveTopBtn']:
              assert key in collector.ids, f'Missing required DOM ID: {key}'
          assert len(collector.ids) == len(set(collector.ids)), 'Duplicate DOM IDs'
          assert 'HKUST 正式题库' not in html, 'Unverified official question-bank claim'
          assert 'src="./question-bank/questions.js"' in html, 'Missing question data source'
          data = Path('question-bank/questions.js').read_text(encoding='utf-8')
          assert 'BANKS.D = {' in data, '2026 Fall drills not included'
          assert 'PAST_QUESTION_IDS' in data, 'Merged past question index missing'
          assert 'LEGACY_QUESTION_ALIASES' in data, 'Legacy note mapping missing'
          assert 'sec-bankB' not in html and 'sec-bankC' not in html, 'Old section still visible'
          assert html.count('<section id="sec-bank') == 2, 'Expected two banks'
          print(f'HTML smoke checks passed ({len(collector.ids)} IDs).')
          image = Path('assets/Administration-Building-14-1536x864.jpg').read_bytes()
          assert image[:3] == b'\xff\xd8\xff', 'Invalid JPEG signature'
          assert image[-2:] == b'\xff\xd9', 'Incomplete JPEG file'
          assert len(image) > 8000, 'Hero image unexpectedly small'
          asset_url = './assets/Administration-Building-14-1536x864.jpg'
          assert html.count(asset_url) == 3, 'Expected preload, desktop and mobile hero image references'
          print(f'Campus JPEG file header and references valid: {len(image)} bytes.')
          PY
      - name: Decode hero image
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/Administration-Building-14-1536x864.jpg')
          with Image.open(p) as img:
              img.load()
              assert img.width >= 450 and img.height >= 240, f'Unexpected image dimensions: {img.size}'
              print('Hero image decoded:', img.size)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/elpa-app.js
          node --check question-bank/questions.js
