name: Validate ELPA website

on:
  pull_request:
    paths:
      - 'index.html'
      - 'question-bank/questions.js'
      - 'assets/hkustgz-campus.webp'
      - '.github/workflows/site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'question-bank/questions.js'
      - '.github/workflows/site-checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract script and check required UI elements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert len(scripts) == 1, 'Expected a single inline JavaScript application script'
          Path('/tmp/elpa-app.js').write_text(scripts[0], encoding='utf-8')

          class IdCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  props = dict(attrs)
                  if 'id' in props:
                      self.ids.append(props['id'])
          collector = IdCollector()
          collector.feed(html)
          for key in ['searchInput', 'statusFilter', 'matchCount', 'backupBtn',
                      'restoreBtn', 'restoreInput', 'bankA', 'bankB', 'bankC',
                      'bankD', 'progressBar', 'saveBtn', 'saveTopBtn']:
              assert key in collector.ids, f'Missing required DOM ID: {key}'
          assert len(collector.ids) == len(set(collector.ids)), 'Duplicate DOM IDs'
          assert 'HKUST 正式题库' not in html, 'Unverified official question-bank claim'
          assert 'src="./question-bank/questions.js"' in html, 'Missing question data source'
          data = Path('question-bank/questions.js').read_text(encoding='utf-8')
          assert 'BANKS.D = {' in data, '2026 Fall drills not included'
          print(f'HTML smoke checks passed ({len(collector.ids)} IDs).')
          from base64 import b64encode
          from struct import unpack
          image = Path('assets/hkustgz-campus.webp').read_bytes()
          assert image[:4] == b'RIFF' and image[8:12] == b'WEBP', 'Invalid WebP image header'
          encoded = b64encode(image).decode('ascii')
          anchors = ["UklGRt4lAABXRUJQVlA4INIl", "/7IQ/Tzpm+oun1NWeNDcU3Dq",
              "FP9wXxfZ0vG9xKZJBtiKeT2W", "WdZJsUGIcSXBoZLqv9UWsBMA",
              "58MIrg+8Tu5V2Ot85JKZoFJw", "CoIikV1a84wnYBmZXnGuz3RZ",
              "niUSlaDGa3+BaEXwnlcR6ZeB", "GgBvpNk8pyWMzm4/Ckf4S8Ud",
              "BDkMeTWrZPFGdJjza051nfYF", "UVLNxXbyGWO+vNR6DINTidoj",
              "lEQ2tlK3CGDib2AnJhvgqjkI", "s8elRy9plG4Y6M3OZ5/ZzjmE",
              "v3cuBCMdJLlYtXIEtRC7I74c", "fKXYzY0WcLXF6tFpqcO5Hg2d",
              "csj6lb5sk9ox2KzhNV1AoFAR", "CoJd/lhroANuhAn7WJ/6rgkS",
              "7gxrVgRkZdXGbLQhoBRSpwYb", "tQYGZ6BRsSoP5eBZpMZhwp4w",
              "F6bslL4P3VcsRUmCcpJeb7wd", "o1010tJhnZmON2lCPklx/zo1",
              "ZNDdznmUJHA99C+N63gzi4MK", "2xytuZRkcF8XKrjkdwgUAq0d",
              "QLOT2QotAnrJk5ry6Q6HGEpp", "sitIOgEvzqBS/0JG8LcXjVYo",
              "a7MbnvFKX/cJ4vZNQ1obmKyH", "KElkUerNYebR4RWWuGsjUyZZ"]
          print('Asset diagnostics:', len(image), len(encoded), [encoded.find(t) for t in anchors])
          assert len(image) == unpack('<I', image[4:8])[0] + 8, 'Truncated image data'
          PY
      - name: Check JavaScript syntax
        run: |
          node --check /tmp/elpa-app.js
          node --check question-bank/questions.js
